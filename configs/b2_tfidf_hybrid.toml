name = "b2_tfidf_hybrid"
seed = 42

[data]
directory = "dataset"

[validation]
fold_count = 5
fold_index = 0
max_queries = 2452

[tfidf]
item_fields = [
    "item_title_raw",
    "item_infm_params_text",
]
query_fields = [
    "search_query",
    "search_infm_params_text",
]
ngram_range = [1, 2]
min_df = 2

[char_tfidf]
enabled = true
item_fields = ["item_title_raw"]
query_fields = ["search_query"]
analyzer = "char_wb"
ngram_range = [3, 5]
min_df = 3
max_features = 300000

[fusion]
candidate_pool_size = 100
rrf_k = 60

[geography]
enabled = true
local_candidates = 40
global_candidates = 10
